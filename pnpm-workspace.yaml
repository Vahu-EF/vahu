packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild

# GHSA-g3hv-75wg-m249: minimatch < 11.0.1 is a denial-of-service risk through
# glob parts amplification. It arrives transitively via eslint and
# typescript-eslint, so the range is lifted here until those declare it.
overrides:
  minimatch@<11.0.1: ^11.0.1

name: Bug report
description: Report a defect in the VAHU repository or CLI.
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, private paths, or security-sensitive details. For a vulnerability, use the private process in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest commands or files needed to reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VAHU version or commit
      placeholder: commit hash, branch, or "main"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node.js version, pnpm version, operating system
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redact secrets and private values.
      render: shell

name: Release preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run required checks
        run: pnpm check

      - name: Pack and verify candidate artifacts
        run: pnpm release:pack

      - name: Verify the checksum manifest
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vahu-release-candidate
          path: |
            artifacts/*.tgz
            artifacts/SHA256SUMS
          if-no-files-found: error

      # This workflow deliberately does not publish to npm or create a GitHub
      # Release. Publication requires an approved release decision, credentials
      # configured outside the repository, and provenance-enabled publishing.

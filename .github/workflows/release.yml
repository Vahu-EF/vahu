name: Release preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run required checks
        run: pnpm check

      - name: Pack candidate artifacts
        run: |
          mkdir -p artifacts
          pnpm --filter vahu pack --pack-destination artifacts
          pnpm --filter @vahu-ef/core pack --pack-destination artifacts
          pnpm --filter @vahu-ef/schemas pack --pack-destination artifacts

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vahu-release-candidate
          path: artifacts/
          if-no-files-found: error

      # This workflow deliberately does not publish to npm or create a GitHub
      # Release. Adding those steps requires an approved release decision,
      # credentials configured outside the repository, and signed artifacts.

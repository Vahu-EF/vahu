name: Release preparation

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the verified 0.1.0 tarballs to npm with provenance.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run required checks
        run: pnpm check

      - name: Pack and verify candidate artifacts
        run: pnpm release:pack

      - name: Verify the checksum manifest
        working-directory: artifacts
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vahu-release-candidate
          path: |
            artifacts/*.tgz
            artifacts/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish to npm
    if: inputs.publish_npm
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm with provenance support
        run: npm install --global npm@^11.5.1

      - name: Download verified release candidate
        uses: actions/download-artifact@v7
        with:
          name: vahu-release-candidate
          path: artifacts

      - name: Verify checksums, npm access, and version availability
        working-directory: artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo '::error::Configure the repository Actions secret NPM_TOKEN before publishing.'
            exit 1
          fi
          sha256sum -c SHA256SUMS
          npm whoami --registry=https://registry.npmjs.org/
          for package_version in \
            'vahu/0.1.0' \
            '@vahu-ef%2fadapters/0.1.0' \
            '@vahu-ef%2fcore/0.1.0' \
            '@vahu-ef%2fschemas/0.1.0'; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/${package_version}")"
            if [ "$status" = '200' ]; then
              echo "Refusing to overwrite existing npm version: ${package_version}"
              exit 1
            fi
            if [ "$status" != '404' ]; then
              echo "Unexpected npm registry response ${status} for ${package_version}"
              exit 1
            fi
          done

      - name: Publish verified tarballs to npm with provenance
        working-directory: artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish vahu-ef-schemas-0.1.0.tgz --provenance --access public --registry=https://registry.npmjs.org/
          npm publish vahu-ef-adapters-0.1.0.tgz --provenance --access public --registry=https://registry.npmjs.org/
          npm publish vahu-ef-core-0.1.0.tgz --provenance --access public --registry=https://registry.npmjs.org/
          npm publish vahu-0.1.0.tgz --provenance --access public --registry=https://registry.npmjs.org/
